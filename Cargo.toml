[workspace]
resolver = "2"
members = [
    "crates/iceon-core",
    "crates/iceon-ui",
    "crates/iceon-app",
    "crates/iceon-xtask",
]
default-members = ["crates/iceon-app"]

[workspace.package]
version = "0.1.8"
edition = "2024"
license = "Apache-2.0"
authors = ["you"]

# Optimize layout (taffy), text shaping (cosmic-text), SVG rasterization (resvg),
# and GPUI rendering in debug builds so virtual lists scroll smoothly at 60-120 FPS.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[workspace.dependencies]
iceon-core = { path = "crates/iceon-core" }
iceon-ui = { path = "crates/iceon-ui" }
gpui-kit = { version = "0.9.0", features = ["tree-sitter-yaml"] }
axum = "0.8"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_yaml_ng = "0.10"
log = "0.4"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
fs2 = "0.4"
futures = "0.3"
futures-util = "0.3"
getrandom = "0.4"
http = "1"
http-body-util = "0.1"
jiff = "0.2"
k8s-openapi = { version = "0.28", default-features = false, features = ["latest"] }
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
kube = { version = "4.2", default-features = false, features = ["client", "config", "rustls-tls", "ws", "gzip"] }
libc = "0.2"
percent-encoding = "2.3"
process-wrap = { version = "9.0.1", features = ["tokio1", "kill-on-drop"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled", "limits"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
semver = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1.8", features = ["derive"] }

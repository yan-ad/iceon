name: CI

on:
  push:
    branches: [super]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  ubuntu:
    name: Core and release tooling (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ubuntu-core

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test native release tooling
        run: python -m unittest discover -s .github/scripts -p 'test_native_release.py' -v

      # GPUI/native packaging remain covered by the shipped-platform jobs below.
      # Do not build the default app member on this headless Linux runner.
      - name: Check portable crates and all targets
        run: cargo check -p iceon-core -p iceon-xtask --all-targets --all-features --locked

      - name: Test portable crates
        run: cargo test -p iceon-core -p iceon-xtask --all-features --locked

      - name: Lint portable crates
        run: cargo clippy -p iceon-core -p iceon-xtask --all-targets --all-features --locked -- -D warnings

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Only platforms shipped by the native release pipeline.
        os: [macos-15]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test native release tooling
        run: python3 -m unittest discover -s .github/scripts -p 'test_native_release.py' -v

      - name: Check workspace and all targets
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Run workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --all-features --locked

  windows-x86:
    name: Rust compile (Windows x86)
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - uses: ./.github/actions/msvc-x86-linker

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: i686-pc-windows-msvc

      - name: Check workspace for Windows x86
        run: cargo check --workspace --all-targets --all-features --locked --target i686-pc-windows-msvc

      - name: Build workspace for Windows x86
        run: cargo build --workspace --all-features --locked --target i686-pc-windows-msvc

name: CI

on:
  push:
    branches: [super]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential pkg-config libfontconfig1-dev libfreetype6-dev \
            libgtk-3-dev libx11-dev libxcb1-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace and all targets
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Run workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Build workspace
        run: cargo build --workspace --all-features --locked

  windows-x86:
    name: Rust compile (Windows x86)
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - uses: ./.github/actions/msvc-x86-linker

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: i686-pc-windows-msvc

      - name: Check workspace for Windows x86
        run: cargo check --workspace --all-targets --all-features --locked --target i686-pc-windows-msvc

      - name: Build workspace for Windows x86
        run: cargo build --workspace --all-features --locked --target i686-pc-windows-msvc

name: Native stable release

on:
  push:
    tags: ['0.1.2']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable tag at this workflow commit (exactly 0.1.2)'
        required: true
        type: string
        default: '0.1.2'

permissions:
  contents: read

concurrency:
  group: native-release-0.1.2
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  CARGO_INCREMENTAL: 0

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag_object: ${{ steps.guard.outputs.tag_object }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test native release helpers
        run: python -m unittest discover -s .github/scripts -p 'test_native_release.py' -v
      - name: Validate canonical source, immutable tag, versions, lock and changelog
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/native_release.py guard

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    needs: [validate, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            package: mac
          - os: windows-2022
            target: i686-pc-windows-msvc
            package: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck immutable tag before building
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
        run: python .github/scripts/native_release.py guard --tag-object "$TAG_OBJECT"
        shell: bash
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x86
      - uses: ./.github/actions/msvc-x86-linker
        if: runner.os == 'Windows'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: native-release-${{ matrix.target }}
      - name: Build native app (embedded GPUI icons and fonts)
        run: cargo build --release --locked -p iceon-app --target ${{ matrix.target }}
      - name: Package and validate native app
        run: python .github/scripts/native_release.py package-${{ matrix.package }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate, ci, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Verify transferred artifacts and create checksum manifest
        run: python .github/scripts/native_release.py checksums
      - name: Create fresh draft, verify uploaded bytes, publish stable/latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_OBJECT: ${{ needs.validate.outputs.tag_object }}
        run: python .github/scripts/native_release.py publish --tag-object "$TAG_OBJECT"

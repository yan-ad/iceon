[package]
name = "iceon-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui-kit.workspace = true
gpui-kit-assets = "=0.9.0"
vt100.workspace = true
iceon-core.workspace = true
iceon-extension.workspace = true
jiff.workspace = true
tokio.workspace = true
futures.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSMenu", "NSMenuItem", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSImage", "NSColor", "NSColorSpace", "NSBezierPath", "NSGradient", "NSGraphics", "NSGraphicsContext", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSObject", "NSString", "NSGeometry", "NSNotification"] }
block2 = "=0.6.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["UI_ViewManagement", "UI", "Foundation"] }

[package]
name = "iceon"
version = "0.1.1"
description = "Iceon Kubernetes desktop workspace"
authors = ["Yanuar"]
edition = "2024"
default-run = "iceon"

[features]
dev-engine = ["dep:axum", "tokio/signal", "tokio/io-std", "tokio/rt-multi-thread"]

[[bin]]
name = "iceon-dev-engine"
path = "src/bin/iceon-dev-engine.rs"
required-features = ["dev-engine"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "iceon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", optional = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
semver = "1"
tempfile = "3"
url = "2"
rusqlite = { version = "0.40", features = ["bundled", "limits"] }
getrandom = "0.4"
fs2 = "0.4"
kube = { version = "4.2.0", default-features = true, features = ["ws"] }
futures = "0.3"
k8s-openapi = { version = "0.28.0", features = ["latest"] }
tokio = { version = "1", features = ["sync", "time", "macros", "process", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
http = "1"
http-body-util = "0.1"
base64 = "0.22"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
jiff = "0.2"
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
tauri-plugin-updater = "=2.14.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
tauri-plugin-dialog = "2"
zeroize = "1.8"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
